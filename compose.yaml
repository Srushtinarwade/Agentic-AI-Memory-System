# Optional: ONLY Neo4j runs in Docker. The FastAPI and embeddings run natively on your laptop.
# Create .env first, set NEO4J_PASSWORD, then: docker compose up -d
services:
  neo4j:
    image: neo4j:2026.09.0-community
    container_name: graph-memory-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser, laptop only
      - "127.0.0.1:7687:7687"   # Bolt driver, laptop only
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env first}"
      GRAPH_MEMORY_NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env first}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$GRAPH_MEMORY_NEO4J_PASSWORD\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s

volumes:
  neo4j_data:
  neo4j_logs:
